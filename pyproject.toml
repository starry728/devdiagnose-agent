[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devdiagnose"
version = "0.1.0"
description = "Version-aware developer diagnosis with evidence and an inspectable agent harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0", "uvicorn>=0.30,<1", "pydantic>=2.12,<3",
  "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2", "packaging>=24",
  "deepagents==0.7.41", "langgraph==1.2.24", "langgraph-checkpoint-sqlite>=3,<5",
  "langchain-openai>=1.8.5,<2", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
